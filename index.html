<style>
:root{
  --bg:#0b0d14; --panel:rgba(255,255,255,.04); --card2:rgba(255,255,255,.06); --line:rgba(255,255,255,.08);
  --text:#eceef6; --muted:#8a90a6; --a1:#8b5cf6; --a2:#22d3ee; --ok:#34d399; --bad:#fb7185; --gold:#fbbf24;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{min-height:100vh;color:var(--text);font-family:"Segoe UI",-apple-system,Roboto,system-ui,sans-serif;
  background:radial-gradient(700px 420px at 100% -8%,rgba(139,92,246,.24),transparent),radial-gradient(560px 440px at -10% 108%,rgba(34,211,238,.14),transparent),var(--bg);
  background-attachment:fixed;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 110px)}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;width:100%}
input:focus{border-color:var(--a1)}

/* cabeçalho igual ao Helparino */
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:800;letter-spacing:.4px}
.lemb{flex:none;width:34px;height:34px;filter:drop-shadow(0 0 8px rgba(139,92,246,.55))}
.logo span{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(139,92,246,.35))}
.me{text-align:right;font-size:12px;color:var(--muted);line-height:1.35}
.me b{color:var(--text);font-size:13px}
.me button{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.sy{font-size:11px}.sy.ok{color:var(--ok)}

/* separadores como o menu do Helparino */
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:12px;backdrop-filter:blur(10px)}
.tabs button{flex:1;border:0;background:none;padding:11px 4px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted);position:relative;display:flex;gap:6px;align-items:center;justify-content:center;transition:.2s}
.tabs button.on{color:#fff;background:linear-gradient(90deg,rgba(139,92,246,.35),rgba(34,211,238,.12));box-shadow:inset 0 0 0 1px rgba(139,92,246,.45)}
.tabs .n{font-weight:600;font-size:11px;opacity:.75}
.tabs .dot{position:absolute;top:7px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.tabs .dot.bad{background:var(--bad)}.tabs .dot.run{background:var(--a2);box-shadow:0 0 8px var(--a2)}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 10px}
.sec-h h1{font-size:21px}
.status{font-size:12px;color:var(--ok)}
.status::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 10px var(--ok)}
.status.off{color:var(--muted)}.status.off::before{background:var(--muted);box-shadow:none}

.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{color:#fff;border-color:rgba(139,92,246,.7);background:rgba(139,92,246,.25)}
.chip .del{margin-left:6px;color:var(--bad)}

/* cartões como no Helparino */
.it{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;animation:in .3s ease;transition:border-color .3s,box-shadow .3s}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.98)}}
.it.run{border-color:rgba(34,211,238,.5);box-shadow:0 0 30px -10px rgba(34,211,238,.5)}
.it.warn{border-color:rgba(251,191,36,.6);box-shadow:0 0 30px -10px rgba(251,191,36,.5)}
.it.done,.it.over{border-color:rgba(251,113,133,.6);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 34px -6px rgba(251,113,133,.6)}}
.top{display:flex;gap:14px;align-items:center}
.ring{flex:none;position:relative;width:84px;height:84px}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.07)}
.ring .fg{stroke:url(#g);transition:stroke-dashoffset .4s linear}
.it.warn .ring .fg{stroke:var(--gold)}
.it.done .ring .fg,.it.over .ring .fg{stroke:var(--bad)}
.time{position:absolute;inset:0;display:grid;place-items:center;font:700 15px Consolas,ui-monospace,monospace;text-align:center;line-height:1.15}
.time b{display:block;font-size:20px}.time small{font:600 11px Consolas,ui-monospace,monospace;color:var(--muted)}
.time .ot{color:var(--bad)}
.info{flex:1;min-width:0;padding-right:18px}
.nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub1{color:var(--muted);font-size:12.5px;margin-top:4px}
.sub1 b{color:var(--text);font-weight:600}
.it.warn .end{color:var(--gold);font-weight:600}.it.done .end{color:var(--bad);font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.3px;margin:0 6px 4px 0}
.badge.Capacete{background:rgba(34,211,238,.15);color:#67e8f9;border:1px solid rgba(34,211,238,.4)}
.badge.Armadura{background:rgba(139,92,246,.18);color:#c4b5fd;border:1px solid rgba(139,92,246,.45)}
.badge.Arma{background:rgba(251,113,133,.15);color:#fda4af;border:1px solid rgba(251,113,133,.4)}
.badge.Prancha{background:rgba(52,211,153,.15);color:#6ee7b7;border:1px solid rgba(52,211,153,.4)}
.badge.race{background:rgba(251,191,36,.12);color:#fcd34d;border:1px solid rgba(251,191,36,.4)}
.x{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);font-size:15px;padding:4px}
.subs{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.sub{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding:4px 2px;gap:8px}
.sub b{font:600 14px Consolas,ui-monospace,monospace;color:var(--text)}
.it.run .sub b{color:var(--a2)}
.sub .r{display:flex;gap:8px;align-items:center}
.cbs{display:flex;gap:5px}
.cb{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:13px}
.cb.on{background:var(--gold);border-color:var(--gold);color:#1a1300}
.recs{margin-top:10px;padding:9px 12px;border-radius:12px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.25);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.recs b{font:700 15px Consolas,monospace;color:var(--gold)}
.recs .last{font:600 13px Consolas,monospace;color:var(--text)}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:12px;padding:11px 8px;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(90deg,var(--a1),#6366f1)}
.btn.sec{background:var(--card2);border:1px solid var(--line);color:var(--text)}
.btn.rec{background:linear-gradient(90deg,#10b981,#0ea5a4)}
.btn.dl{flex:none;background:var(--card2);border:1px solid var(--line);color:var(--bad);padding:11px 14px}
.btn.sm{flex:none;padding:6px 12px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.35}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2))}

/* ===== Bosses: cartões em destaque ===== */

.bh{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:18px 16px;margin-bottom:14px;border-radius:24px;

/* ===== Visual "app" ===== */
body{padding-bottom:calc(env(safe-area-inset-bottom) + 120px)}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 20% 15%,rgba(139,92,246,.30),transparent 70%),radial-gradient(35% 30% at 85% 30%,rgba(34,211,238,.18),transparent 70%),radial-gradient(40% 35% at 50% 95%,rgba(236,72,153,.14),transparent 70%);
  animation:aurora 22s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate3d(4%,-3%,0) rotate(8deg) scale(1.08)}}
header{position:sticky;top:0;z-index:6;margin:calc(-1*env(safe-area-inset-top) - 14px) -14px 14px;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
  background:rgba(11,13,20,.55);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
.lemb{animation:glow 4s ease-in-out infinite}

.me{display:flex;align-items:center;gap:10px;text-align:right}
.av{order:2;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 20px -8px rgba(139,92,246,.9)}
/* resumo */
.hero{margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-radius:18px;padding:12px 11px 11px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 18%,transparent),rgba(255,255,255,.03));display:flex;flex-direction:column;gap:1px;transition:.2s}
.tile.on{border-color:color-mix(in srgb,var(--tc) 60%,transparent);box-shadow:0 10px 26px -14px var(--tc)}
.tile .tico{font-size:15px;color:var(--tc);margin-bottom:4px}
.tile b{font-size:26px;font-weight:800;line-height:1}
.tile span:last-child{font-size:11px;color:var(--muted);font-weight:600}
.tile.hot b{color:var(--gold)}
.tile.hot::after{content:"";position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:blink 1.4s infinite}
.next{margin-top:8px;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13px}
.next span{color:var(--muted);flex:none}
.next b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next em{font:700 15px Consolas,ui-monospace,monospace;font-style:normal;color:var(--a2)}
.sec-h h1{font-size:22px;letter-spacing:.2px}
/* navegação em baixo, estilo app */
.tabs{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:7;margin:0;padding:6px;border-radius:22px;
  background:rgba(18,21,34,.72);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 18px 40px -12px #000}
.tabs button{flex-direction:column;gap:2px;padding:8px 4px 7px;border-radius:16px;font-size:11.5px}
.tabs .ti{position:relative;font-size:20px;line-height:1}
.tabs .tl{font-weight:700}
.tabs .n{position:absolute;top:-6px;right:-16px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.12);color:var(--text);font-size:10.5px;font-weight:800;display:grid;place-items:center;opacity:1;margin:0}
.tabs button.on .n{background:var(--a1)}
.tabs .dot{top:8px;left:calc(50% - 20px);right:auto}
.fab{bottom:calc(env(safe-area-inset-bottom) + 92px);border-radius:22px;animation:fabin .4s ease}

/* trajes e pets com cor própria */
.it.kc{border-radius:22px;background:linear-gradient(140deg,color-mix(in srgb,var(--kc) 13%,transparent),rgba(255,255,255,.03) 60%);border-color:color-mix(in srgb,var(--kc) 30%,transparent)}

.it.kc.done{border-color:rgba(251,113,133,.65)}
.who2{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:14px;font-weight:600}
.cav{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#0b0d14;background:var(--kc)}
.pbar{height:4px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:12px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--kc),color-mix(in srgb,var(--kc) 40%,#fff));transition:width .4s linear}
.it.warn .pbar i{background:var(--gold)}
.btn{transition:transform .12s,filter .2s}.btn:active{transform:scale(.96)}
.empty{background:rgba(255,255,255,.025)}
.eico{font-size:40px;margin-bottom:10px;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sheet{background:rgba(18,21,34,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
@media (prefers-reduced-motion:reduce){body::before,.lemb,.tile.hot::after{animation:none}}

/* ===== Polimento extra ===== */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 12%,#c4b5fd,transparent),radial-gradient(1.5px 1.5px at 40% 42%,#fff,transparent),
  radial-gradient(1px 1px at 88% 56%,#67e8f9,transparent),radial-gradient(1px 1px at 22% 74%,#fff,transparent),radial-gradient(1.5px 1.5px at 62% 86%,#fde68a,transparent),
  radial-gradient(1px 1px at 8% 92%,#fff,transparent),radial-gradient(1px 1px at 52% 6%,#fff,transparent),radial-gradient(1px 1px at 94% 30%,#fff,transparent);
  animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.2}}
.greet{display:flex;flex-direction:column;gap:2px;margin:0 2px 12px}
.greet b{font-size:22px;font-weight:800;letter-spacing:.2px;background:linear-gradient(90deg,#fff,#c4b5fd 60%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.greet span{font-size:13px;color:var(--muted)}
.cgrp .who2{display:none}
.wave{display:inline-block;-webkit-text-fill-color:initial;animation:wave 2.4s ease-in-out 1}
@keyframes wave{20%{transform:rotate(18deg)}40%{transform:rotate(-10deg)}60%{transform:rotate(14deg)}80%{transform:rotate(-4deg)}}
.tile .tico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px;
  background:color-mix(in srgb,var(--tc) 22%,transparent);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent)}
.tile .tico i{font-style:normal;font-size:15px}
.tile b{font-size:28px}
/* brilho de vidro nos cartões */
.it,.bh,.tile,.next{isolation:isolate}
.it::before,.bh::before,.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 38%)}
.it.kc{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
.it.kc.done{animation:rise .45s both,pulse 1.2s infinite .5s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}}
.ring::after{content:"";position:absolute;inset:14px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,color-mix(in srgb,var(--kc,#8b5cf6) 22%,transparent),transparent 70%)}
.bring::after{content:"";position:absolute;inset:18px;border-radius:50%;z-index:-1;background:radial-gradient(circle,color-mix(in srgb,var(--bc) 28%,transparent),transparent 70%)}
.ring,.bring{isolation:isolate}
.time b{text-shadow:0 0 18px color-mix(in srgb,var(--kc,var(--bc,#8b5cf6)) 60%,transparent)}
/* grupos por personagem */
.cgrp{margin-bottom:8px}
.chead{display:flex;align-items:center;gap:10px;margin:14px 4px 10px}
.chead b{font-size:17px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* bosses parados */
.bt{position:relative;opacity:1;background:linear-gradient(150deg,color-mix(in srgb,var(--bc) 10%,transparent),rgba(255,255,255,.03));border-color:color-mix(in srgb,var(--bc) 22%,transparent)}
.bt .bdur{font-family:Consolas,ui-monospace,monospace}
.bh .bnm{background:linear-gradient(90deg,#fff,color-mix(in srgb,var(--bc) 60%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
/* login com bolas de luz */

.pglow{position:absolute;inset:-6px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--kc) 40%,transparent);animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pmed img{position:relative;width:100px;height:100px;object-fit:contain;margin-top:-12px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.55));animation:bfloat 4.5s ease-in-out infinite alternate}
.pemo{font-size:34px;color:var(--kc)}
.pinfo{grid-area:info;min-width:0}
.ptag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--kc);
  padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--kc) 14%,transparent);border:1px solid color-mix(in srgb,var(--kc) 38%,transparent)}
.pname{font-size:18px;font-weight:800;margin:6px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchar{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#cfd3e2}
.pchar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cgrp .pchar{display:none}
.ptime{grid-area:time;justify-self:end}
.ptime .ring{width:66px;height:66px}
.ptime .ring svg{width:66px;height:66px}
.ptime .ring circle{stroke-width:7}
.ptime .ring .fg{stroke:var(--kc)}
.ptime .ring svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--kc) 60%,transparent))}
.ptime .time b{font-size:15px}.ptime .time small{font-size:9.5px}
.pc2.warn .ptime .ring .fg{stroke:var(--gold)}.pc2.done .ptime .ring .fg{stroke:var(--bad)}
.pfoot{grid-area:foot;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)}
.pend{font-size:12.5px;color:var(--muted);min-width:0}
.pc2.warn .pend{color:var(--gold);font-weight:700}.pc2.done .pend{color:var(--bad);font-weight:700}
.pacts{display:flex;gap:6px;flex:none}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);font-size:15px;display:grid;place-items:center;transition:transform .12s}
.ib:active{transform:scale(.92)}
.ib.go2{background:linear-gradient(135deg,var(--a1),#6366f1);border-color:transparent}
.ib.dl2{color:var(--bad)}
.pbar2{grid-area:bar;height:4px;margin:10px -14px 0;background:rgba(255,255,255,.05)}
.pbar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--kc),color-mix(in srgb,var(--kc) 40%,#fff));box-shadow:0 0 10px var(--kc);transition:width .4s linear}
.pc2.warn .pbar2 i{background:var(--gold);box-shadow:0 0 10px var(--gold)}
@media (prefers-reduced-motion:reduce){.pglow,.pmed img{animation:none}}
/* ===== Pets e trajes: cartões estilo PC ===== */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pcx{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 10px 12px;border-radius:20px;overflow:hidden;isolation:isolate;
  background:linear-gradient(160deg,color-mix(in srgb,var(--kc) 13%,transparent),rgba(255,255,255,.03) 55%);border:1px solid color-mix(in srgb,var(--kc) 35%,transparent);
  box-shadow:0 14px 28px -20px #000;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
.pcx::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--kc),transparent)}
.pcx.run{border-color:color-mix(in srgb,var(--kc) 55%,transparent);box-shadow:0 0 26px -12px var(--kc)}
.pcx.warn{border-color:rgba(251,191,36,.6);box-shadow:0 0 26px -10px rgba(251,191,36,.6)}
.pcx.done{border-color:rgba(251,113,133,.6);animation:rise .45s both,pulse 1.2s infinite .5s}
.kart2{position:absolute;right:-26px;top:-6px;width:140px;height:150px;z-index:-1;pointer-events:none;display:flex;align-items:center;justify-content:center;
  -webkit-mask-image:radial-gradient(closest-side at 60% 45%,#000 50%,transparent 100%);mask-image:radial-gradient(closest-side at 60% 45%,#000 50%,transparent 100%)}
.kart2 img{max-width:100%;max-height:100%;object-fit:contain;opacity:.7;filter:drop-shadow(0 0 12px color-mix(in srgb,var(--kc) 65%,transparent));animation:bfloat 5s ease-in-out infinite alternate}
.pcx .ptag{font-size:9.5px;padding:2px 8px}
.pcx .pname{font-size:15.5px;margin:6px 0 4px;max-width:100%}
.pchar2{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);max-width:100%}
.pchar2 b{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cgrp .pchar2{display:none}
.pbig{margin:10px 0 6px}
.pbig .ring{width:100px;height:100px}.pbig .ring svg{width:100px;height:100px}
.pbig .ring circle{stroke-width:6}
.pbig .ring .fg{stroke:var(--kc)}
.pbig .ring svg{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--kc) 60%,transparent))}
.pcx.warn .pbig .ring .fg{stroke:var(--gold)}.pcx.done .pbig .ring .fg{stroke:var(--bad)}
.pbig .time b{font-size:20px}.pbig .time small{font-size:10.5px}
.pbig .ring::after{content:"";position:absolute;inset:14px;border-radius:50%;z-index:-1;background:radial-gradient(circle,color-mix(in srgb,var(--kc) 22%,transparent),transparent 70%)}
.pend2{font-size:11px;color:var(--muted);min-height:15px}
.pcx.warn .pend2{color:var(--gold);font-weight:700}.pcx.done .pend2{color:var(--bad);font-weight:700}
.pdur2{font-size:10.5px;color:var(--muted);opacity:.8;margin-top:2px}
.pacts2{display:flex;gap:6px;margin-top:10px}
.pacts2 .ib{width:40px;height:36px}
@media (prefers-reduced-motion:reduce){.kart2 img{animation:none}}
/* ===== Biólogo no telemóvel ===== */
.tabs button{font-size:10.5px}
.biocard{position:relative;margin-bottom:14px;padding:14px 14px 12px 14px;border-radius:22px;overflow:hidden;isolation:isolate;
  background:linear-gradient(140deg,rgba(139,92,246,.16),rgba(255,255,255,.03) 60%);border:1px solid rgba(139,92,246,.3);animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.biocard::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;z-index:-1;background:radial-gradient(closest-side,rgba(139,92,246,.3),transparent)}
.biofig{position:absolute;right:-6px;top:6px;height:118px;z-index:-1;opacity:.55;filter:drop-shadow(0 8px 12px rgba(0,0,0,.6))}
.biohead{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-right:60px}
.brow{display:flex;align-items:center;gap:10px;padding:10px;margin-top:8px;border-radius:16px;background:rgba(11,13,20,.55);border:1px solid var(--line)}
.brow.on{border-color:rgba(34,211,238,.45);box-shadow:0 0 20px -12px #22d3ee}
.brow.yo.on{border-color:rgba(74,222,128,.5);box-shadow:0 0 20px -12px #4ade80}
.bchk{flex:none;width:30px;height:30px;border-radius:9px;border:1.5px solid rgba(255,255,255,.3);background:none;color:#0b0d14;font-size:15px;font-weight:900;display:grid;place-items:center}
.bchk.on{background:#22d3ee;border-color:#22d3ee}.brow.yo .bchk.on{background:#4ade80;border-color:#4ade80}
.bmid{flex:1;min-width:0}
.blbl{font-weight:800;font-size:14.5px}.blbl span{font-size:11px;font-weight:700;color:var(--muted);margin-left:4px}
.bst{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
.brow.on .bst{color:#67e8f9}.brow.yo.on .bst{color:#86efac}
.bbar{height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bbar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a78bfa);transition:width .4s linear}
.brow.yo .bbar i{background:linear-gradient(90deg,#4ade80,#22d3ee)}
.brow:not(.on) .bbar i{background:rgba(255,255,255,.12)}
.bright{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bt2{font:700 17px Consolas,ui-monospace,monospace;color:var(--muted)}
.brow.on .bt2{color:#a7f3d0;text-shadow:0 0 12px rgba(34,211,238,.5)}
.bcuts{display:flex;gap:4px}
.bcuts button{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:8px;padding:4px 6px;font-size:11px;font-weight:700}
/* fundos por raça: figura inteira, sem cortar */
.cgrp{position:relative;isolation:isolate}
.cgrp>.rbg{position:absolute;right:100px;top:0;height:64px;width:90px;z-index:-1;pointer-events:none;display:flex;justify-content:flex-end;align-items:center}
.cgrp>.rbg img{height:100%;width:auto;object-fit:contain;opacity:.3}
.biocard>.rbg{position:absolute;right:62px;top:8px;height:60px;width:90px;z-index:-1;pointer-events:none;display:flex;justify-content:flex-end;align-items:center}
.biocard>.rbg img{height:100%;width:auto;object-fit:contain;opacity:.28}
</style>

function histFix(h){
  if(!h.hid) h.hid = Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
  if(!h.ts){ const m = /(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(h.at||""); h.ts = m ? new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+(m[6]||0)).getTime() : Date.now(); }
  return h; }

    await SB.rest("m2_items?on_conflict=user_id,id", {method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"}, body:JSON.stringify(out)});
    out.forEach(r=>{ this.st.synced[r.id] = r.deleted ? null : cur[r.id]; });
    this.saveSt();
  },
  async cycle(){
    if(this.busy || !SB.ses) return; this.busy = true;
    try{
      const ch = await this.pull();
      if(ch && this.onChange) this.onChange();
      await this.push();
      this.onStatus && this.onStatus(true);
    }catch(e){
      if(e.message === "AUTH"){ this.stop(); this.onAuthLost && this.onAuthLost(); }
      else this.onStatus && this.onStatus(false, e.message);
    }
    this.busy = false;
  },
  touch(){ if(!SB.ses) return; clearTimeout(this.tm); this.tm = setTimeout(()=>this.cycle(), 1200); },
  start(){ this.stop(); this.loadSt(); this.cycle(); this.iv = setInterval(()=>{ if(!document.hidden) this.cycle(); }, 5000); },
  stop(){ clearInterval(this.iv); clearTimeout(this.tm); this.iv = null; }
};
function authMsg(e, up){
  const m = String(e.message||e);
  if(m === "OFFLINE") return "Sem ligação à internet.";
  if(m === "CONFIRM") return "Conta criada, mas o Supabase pede confirmação de email. Desativa \"Confirm email\" no Supabase.";
  if(/invalid login/i.test(m)) return "Nome ou password errados.";
  if(/already registered|already exists/i.test(m)) return "Esse nome já existe.";
  if(/password/i.test(m) && /least|short|6/i.test(m)) return "A password tem de ter pelo menos 6 caracteres.";
  if(/rate|too many/i.test(m)) return "Muitas tentativas. Espera um bocado.";
  return (up ? "Não foi possível criar a conta: " : "Não foi possível entrar: ") + m;
}

function bossTime(t){

  return ringT(rem(t));
}
function itemTime(t){
  const st = state(t);
  if(st==="done") return `<b style="font-size:14px;color:var(--bad)">Fim</b>`;
  const s = rem(t), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);

}

}

const raceBg = c => RACE_BG[raceOf(c)] ? `<div class="rbg"><img src="${RACE_BG[raceOf(c)]}" alt=""></div>` : "";
const charImg = (c, cls) => `<img class="${cls||"cimg"}" src="${RACE_IMG[raceOf(c)]}" alt="${esc(raceOf(c))}">`;

// ===== Cores e resumo =====
const KCOL = {Capacete:"#22d3ee", Armadura:"#a78bfa", Arma:"#38bdf8", Prancha:"#60a5fa"};
const PCOL = {"Nessie": "#60a5fa", "Alastor": "#ab4bf0", "Aranha": "#f0744b", "Bashido": "#a78bfa", "Dragonette": "#4be2f0", "Executor": "#818cf8", "Exedyar": "#4bf090", "Macaco": "#f0904b", "Meley": "#f0594b", "Nemere": "#c084fc", "Razador": "#f43f5e"};
const kCol = t => t.page==="trajes" ? (KCOL[t.kind]||"#8b5cf6") : (PCOL[t.race]||"#f472b6");
const pctOf = t => { const st = state(t); return st==="done" ? 0 : st==="stop" ? 100 : Math.max(0, Math.min(100, rem(t)/Math.max(1,total(t))*100)); };
function nextUp(){
  const L = S.timers.filter(t=>t.end && !isOver(t) && !isUp(t) && (t.page==="boss" || state(t)!=="done")).sort((a,b)=>a.end-b.end);
  return L[0] || null;
}
const shortT = s => { const d = Math.floor(s/86400); return d ? d+"d "+p2(Math.floor(s%86400/3600))+"h" : fmt(s); };
function heroNext(){ const n = nextUp(); return n ? `<span>⏭ A seguir</span><b>${esc(n.page==="boss"?bn(n):label(n)+(n.char?" · "+n.char:""))}</b><em>${shortT(rem(n))}</em>` : `<span>⏭ A seguir</span><b>Nada a contar</b><em>—</em>`; }
function renderHero(){
  const bo = bosses().filter(t=>t.end).length, tr = S.timers.filter(t=>t.page==="trajes"), pe = S.timers.filter(t=>t.page==="pets");
  const urg = L => L.filter(t=>["warn","done"].includes(state(t))).length;
  const tile = (k,ico,big,lbl,hot,col) => `<button class="tile ${UI.tab===k?"on":""} ${hot?"hot":""}" style="--tc:${col}" onclick="setTab('${k}')"><span class="tico"><i>${ico}</i></span><b>${big}</b><span>${lbl}</span></button>`;
  const hr = new Date().getHours(), hi = hr<6?"Boa noite":hr<13?"Bom dia":hr<20?"Boa tarde":"Boa noite";
  const dt = new Date().toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"});
  $("hero").innerHTML = `<div class="greet"><b>${hi}, ${esc(CUR)} <span class="wave">👋</span></b><span>${esc(dt.charAt(0).toUpperCase()+dt.slice(1))}</span></div><div class="tiles">
      ${tile("boss","⚔",bo,bo===1?"boss ativo":"bosses ativos",false,"#22d3ee")}
      ${tile("trajes","✦",urg(tr)||tr.length,urg(tr)?"trajes a acabar":"trajes",urg(tr)>0,"#a78bfa")}
      ${tile("pets","❖",urg(pe)||pe.length,urg(pe)?"pets a acabar":"pets",urg(pe)>0,"#fbbf24")}</div>
    <div class="next" data-nx>${heroNext()}</div>`;
}

const durTxt = s => `${Math.floor(s/86400)}d ${Math.floor(s%86400/3600)}h ${Math.floor(s%3600/60)}m`;
// Cartão igual ao do PC: imagem de fundo, etiqueta, nome, personagem, roda grande e botões
const itemCard = (t,k) => { const st = state(t), tr = t.page==="trajes", img = itemImgSrc(t);
  const title = tr ? t.kind : (t.name && t.name!==t.race ? t.name : (t.race||"Pet")), tag = tr ? "Traje" : (t.race||"Pet");
  return `<div class="pcx ${st}" data-id="${t.id}" style="--kc:${kCol(t)};--i:${k}">
    ${img?`<div class="kart2"><img src="${img}" alt=""></div>`:""}
    <span class="ptag">${esc(tag)}</span>
    <div class="pname">${esc(title)}</div>
    <div class="pchar2">${charImg(t.char||"","cimg")}<b>${esc(t.char||"")}</b></div>
    <div class="pbig">${ring(t,itemTime(t))}</div>
    <div class="pend2" data-e>${endText(t)}</div>
    <div class="pdur2">Duração: ${durTxt(t.dur||0)}</div>
    <div class="pacts2"><button class="ib" onclick="openAdjust('${t.id}')" aria-label="Ajustar">✎</button>${st==="stop"
      ?`<button class="ib go2" onclick="startT('${t.id}')" aria-label="Iniciar">▶</button>`:`<button class="ib go2" onclick="restart('${t.id}')" aria-label="Recomeçar">↻</button>`}<button class="ib dl2" onclick="del('${t.id}')" aria-label="Apagar">🗑</button></div>
  </div>`; };

const BIO_H = 22, YOH_H = 24, BH = p => p==="y" ? YOH_H : BIO_H;
const isBio = t => /(^|[^a-z])bio(logo)?([^a-z]|$)/i.test((t||"").normalize("NFD").replace(/[̀-ͯ]/g,""));
const bioEnd = (x,p) => x[p+"e"] || (x[p+"s"] + BH(p)*3600e3*(1-(x[p+"p"]||0)/100));
const bioLeft = (x,p) => Math.max(0, Math.ceil((bioEnd(x,p)-Date.now())/1000));
function bioOf(c){ S.todos = S.todos||{}; const L = S.todos[c] = S.todos[c]||[]; let x = L.find(y=>isBio(y.t)); if(!x){ x = {t:"Biólogo", d:false}; L.unshift(x); } return x; }
const bioOn = (x,p) => !!x[p+"s"];
function bioCheck(c,p){ const x = bioOf(c), now = Date.now();
  if(p==="b"){ x.d = !x.d; if(x.d){ x.bs = now; x.bp = 0; x.be = now + BIO_H*3600e3; } else { x.bs = null; x.bp = 0; x.be = null; } }
  else { x.yo = !x.yo; if(x.yo){ x.ys = now; x.yp = 0; x.ye = now + YOH_H*3600e3; } else { x.ys = null; x.yp = 0; x.ye = null; } }
  save(); render(); }
function bioCut(c,p,q){ const x = bioOf(c), now = Date.now(); if(!x[p+"s"]) return; x[p+"e"] = now + (bioEnd(x,p)-now)*(1-q/100); save(); render(); }
function bioRow(c,x,p){ const on = bioOn(x,p), chk = p==="b" ? !!x.d : !!x.yo, s = on ? bioLeft(x,p) : BH(p)*3600;
  const pct = on ? Math.max(0,Math.min(100, s/(BH(p)*3600)*100)) : 100, ce = esc(JSON.stringify(c));
  return `<div class="brow ${p==="y"?"yo":""} ${on?"on":""}">
    <button class="bchk ${chk?"on":""}" onclick='bioCheck(${ce},"${p}")'>${chk?"✓":""}</button>
    <div class="bmid"><div class="blbl">${p==="y"?"🌿 Yohara":"🧪 Biólogo"} <span>${BH(p)}h</span></div>
      <div class="bst">${on?"Entregue — a contar":"Pronto para entregar"}</div>
      <div class="bbar"><i data-bb="${esc(c)}|${p}" style="width:${pct}%"></i></div></div>
    <div class="bright"><b class="bt2" data-bt="${esc(c)}|${p}">${fmt(s)}</b>
      ${on?`<div class="bcuts">${[30,20,10].map(q=>`<button onclick='bioCut(${ce},"${p}",${q})'>-${q}%</button>`).join("")}</div>`:""}</div></div>`; }
function renderBio(){
  if(!S.chars.length){ $("list").innerHTML = `<div class="empty"><div class="eico">🧪</div><b>Sem personagens</b>Adiciona personagens no Helparino do PC.</div>`; return; }
  const chars = UI.filter ? [UI.filter] : S.chars;
  $("list").innerHTML = chars.map((c,k)=>{ const x = bioOf(c);
    return `<div class="biocard" style="--i:${k}"><img class="biofig" src="${BIO_IMG}" alt="">
      <div class="biohead">${charImg(c,"cimg big")}<div class="cname"><b>${esc(c)}</b><small>${esc(raceOf(c))}</small></div></div>
      ${bioRow(c,x,"b")}${bioRow(c,x,"y")}</div>`; }).join("");
}
function bioTickM(){
  if(!S.todos) return false; let ch = false;
  for(const c in S.todos) (S.todos[c]||[]).forEach(x=>{ if(!isBio(x.t)) return;
    ["b","y"].forEach(p=>{ if(!x[p+"s"] || bioLeft(x,p) > 0) return;
      x[p+"s"] = null; x[p+"p"] = 0; x[p+"e"] = null; if(p==="b") x.d = false; else x.yo = false; ch = true;
      beep(); toast(p==="y" ? "Já podes entregar o biólogo da Yohara no "+c+"!" : "Já podes entregar o biólogo no "+c+"!", "good"); }); });
  return ch;
}

// ===== Desenhar =====
function render(){
  if(!CUR) return;
  const cnt = p => S.timers.filter(t=>t.page===p);
  const flag = p => { const st = cnt(p).map(state); return st.includes("done")||st.includes("over") ? "bad" : st.includes("warn") ? "w" : p==="boss"&&st.includes("run") ? "run" : ""; };
  const bioRun = (S.chars||[]).reduce((n,c)=>{ const x = ((S.todos||{})[c]||[]).find(y=>isBio(y.t)); return n + (x ? (x.bs?1:0)+(x.ys?1:0) : 0); },0);
  const cnt2 = k => k==="bio" ? {length:bioRun} : cnt(k), flag2 = k => k==="bio" ? (bioRun?"run":"") : flag(k);
  $("tabs").innerHTML = [["boss","⚔","Boss"],["trajes","✦","Trajes"],["pets","❖","Pets"],["bio","🧪","Biólogo"]].map(([k,i,n])=>{ const f = flag2(k), cnt = cnt2;
    return `<button class="${UI.tab===k?"on":""}" onclick="setTab('${k}')"><span class="ti">${i}${cnt(k).length?`<span class="n">${cnt(k).length}</span>`:""}</span><span class="tl">${n}</span>${f?`<span class="dot ${f==="w"?"":f}"></span>`:""}</button>`; }).join("");
  renderHero();
  const run = bosses().filter(t=>t.end).length;
  $("sech").innerHTML = `<h1>${UI.tab==="boss"?"⚔ Bosses":UI.tab==="trajes"?"✦ Trajes":UI.tab==="bio"?"🧪 Biólogo":"❖ Pets"}</h1>`+
    (UI.tab==="boss" ? `<span class="status ${run?"":"off"}">${run?run+" ativo"+(run>1?"s":""):"Nenhum ativo"}</span>` : "");

  $("fab").style.display = UI.tab==="boss"||UI.tab==="bio" ? "none" : "";
  if(UI.tab==="boss"){ $("filters").style.display = "none"; renderBosses(); return; }
  if(UI.tab==="bio"){ $("filters").style.display = "none"; renderBio(); return; }
  if(S.chars.length){
    $("filters").style.display = "";
    $("filters").innerHTML = `<button class="chip ${!UI.filter?"on":""}" onclick="setFilter('')">Todos</button>` +
      S.chars.map((c,i)=>`<button class="chip ${UI.filter===c?"on":""}" onclick="${UI.editChars?`delChar(${i})`:`setFilter(${i})`}">${charImg(c,"cimg xs")}${esc(c)}${UI.editChars?`<span class="del">✕</span>`:""}</button>`).join("") +
      `<button class="chip" onclick="UI.editChars=!UI.editChars;render()">${UI.editChars?"✔ Feito":"✎"}</button>`;
  } else $("filters").style.display = "none";

  const L = mine().filter(t=>t.page===UI.tab && (!UI.filter || t.char===UI.filter)).sort((a,b)=>order(a)-order(b));
  if(!L.length){
    $("list").innerHTML = `<div class="empty"><div class="eico">${UI.tab==="trajes"?"✦":"❖"}</div><b>Sem ${UI.tab==="trajes"?"trajes":"pets"} ${UI.filter?"para "+esc(UI.filter):""}</b>Carrega no <b style="display:inline;font-size:inherit">+</b> para adicionar.</div>`;
    return;
  }
  if(UI.filter){ $("list").innerHTML = `<div class="pgrid">${L.map(itemCard).join("")}</div>`; return; }
  const chars = [...new Set(L.map(t=>t.char||"—"))];
  let k = 0;
  $("list").innerHTML = chars.map(c=>{ const its = L.filter(t=>(t.char||"—")===c), hot = its.filter(t=>["warn","done"].includes(state(t))).length;
    return `<section class="cgrp">${raceBg(c)}<div class="chead">${charImg(c,"cimg big")}<div class="cname"><b>${esc(c)}</b><small>${esc(raceOf(c))}</small></div>
      <span class="ccount ${hot?"hot":""}">${hot?hot+" a acabar":its.length+" "+(UI.tab==="trajes"?(its.length===1?"traje":"trajes"):(its.length===1?"pet":"pets"))}</span></div>
      <div class="pgrid">${its.map(t=>itemCard(t,k++)).join("")}</div></section>`; }).join("");
}

function bossExtras(t){
  const cfg = BOSSES[t.name]||{}; let h = "";
  (t.subs||[]).forEach((x,i)=>{ h += `<div class="sub"><span>↳ ${esc(x.n)}</span><b data-s="${i}">${fmt(subRem(t,x))}</b></div>`; });
  if(cfg.elapsed) h += `<div class="sub"><span>⏱ Tempo de dungeon</span><b data-el>${fmt(elapsed(t))}</b></div>`;
  if(cfg.loop) h += `<div class="sub"><span>${loopLabel(cfg)}</span><span class="r"><b data-lp>${fmt(loopRem(t,cfg.loop))}</b>
      <button class="btn sm ${t.loopStart?"sec":""}" data-act="loop">${t.loopStart?"■ Parar":"▶ Play"}</button></span></div>`;
  if(cfg.ptimer) h += `<div class="sub"><span>⏳ ${esc(cfg.ptimer.n)}</span><span class="r"><b data-pt>${fmt(pRem(t,cfg.ptimer))}</b>
      <button class="btn sm ${t.pStart?"sec":""}" data-act="ptim">${t.pStart?"■ Parar":"▶ Play"}</button></span></div>`;
  if(t.name==="Hidra") h += `<div class="sub"><span>🎁 Cofres</span><span class="cbs">${[1,2,3,4,5].map(n=>`<button class="cb ${t.chests===n?"on":""}" data-act="chest${n}">${n}</button>`).join("")}</span></div>`;
  return h ? `<div class="subs">${h}</div>` : "";
}

const bImg = t => BOSS_IMG[t.name] ? `<img src="${BOSS_IMG[t.name]}" alt="">` : "";
const BICON = {"Hidra":"🐉","Nemere":"❄️","Razador":"🔥","Meley":"🐲","Balathor":"💀","Personalizado":"⚔️"};
const BCOL = {"Hidra":"#22d3ee","Nemere":"#93c5fd","Razador":"#fb923c","Meley":"#f472b6","Balathor":"#a78bfa","Personalizado":"#8b5cf6"};
const bIcon = t => BICON[t.name] || "⚔️", bCol = t => BCOL[t.name] || "#8b5cf6";
const hhmm = ms => new Date(ms).toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
function bossEnd(t){
  if(isUp(t)) return `Começou às <b>${hhmm(startOf(t))}</b>`;
  if(isOver(t)) return `Acabou às <b>${hhmm(t.end)}</b>`;
  return `Acaba às <b>${hhmm(t.end)}</b>`;
}
const bigRing = (t,inner) => { const c = 2*Math.PI*54;
  return `<div class="bring"><svg viewBox="0 0 128 128"><circle class="bg" cx="64" cy="64" r="54"/>
    <circle class="fg" cx="64" cy="64" r="54" stroke-dasharray="${c}" stroke-dashoffset="${ringOff(t)*c/RC}" data-f data-c="${c}"/></svg>
    <div class="time" data-t>${inner}</div></div>`; };
function renderBosses(){
  const all = bosses();
  if(!all.length){
    $("list").innerHTML = `<div class="empty"><div class="eico">⚔</div><b>Ainda não tens timers de boss</b>Adiciona-os no Helparino do PC e aparecem aqui.</div>`;
    return;
  }
  const on = all.filter(t=>t.end).sort((a,b)=>(isOver(b)-isOver(a)) || a.end-b.end);
  const off = all.filter(t=>!t.end).sort((a,b)=>bn(a).localeCompare(bn(b)));
  let h = "";
  if(on.length){
    h += `<div class="glabel">⚡ Ativos</div>` + on.map(t=>{ const ov = isOver(t);
      return `<div class="bh ${ov?"over":"run"}" data-id="${t.id}" style="--bc:${bCol(t)}">
        <div class="bglow"></div>${BOSS_IMG[t.name]?`<div class="bart">${bImg(t)}</div>`:""}
        ${bigRing(t,bossTime(t))}
        <div class="bmeta">${BOSS_IMG[t.name]?"":`<div class="bico">${bIcon(t)}</div>`}
          <div class="bnm">${esc(bn(t))}</div>
          <span class="pill ${ov?"bad":""}"><i></i>${ov?"Tempo passou":isUp(t)?"Cronómetro":"A decorrer"}</span>
          <div class="bend" data-end>${bossEnd(t)}</div>
          <div class="bdur">Duração ${fmt(total(t))}</div></div></div>`; }).join("");
  }
  if(off.length){
    h += `<div class="glabel">⏸ Parados</div><div class="bgrid">` + off.map(t=>
      `<div class="bt" style="--bc:${bCol(t)}"><div class="bico sm ${BOSS_IMG[t.name]?"pic":""}">${bImg(t)||bIcon(t)}</div>
        <div><div class="bnm sm">${esc(bn(t))}</div><div class="bdur">${isUp(t)?"Cronómetro":fmt(total(t))}</div></div></div>`).join("") + `</div>`;
  }
  $("list").innerHTML = h;
}
function setTab(t){ UI.tab = t; UI.editChars = false; save(); render(); }
function setFilter(i){ UI.filter = i==="" ? "" : S.chars[i]; save(); render(); }
function delChar(i){
  const c = S.chars[i], n = S.timers.filter(x=>x.char===c).length;
  if(!confirm("Apagar a personagem "+c+(n?" e os seus "+n+" timers":"")+"? (também no PC)")) return;
  S.chars.splice(i,1); S.timers = S.timers.filter(x=>x.char!==c);
  if(UI.filter===c) UI.filter = ""; if(!S.chars.length) UI.editChars = false; save(); render();
}
const find = id => S.timers.find(x=>String(x.id)===String(id));
function startT(id){ const t = find(id); if(!t) return; t.end = Date.now()+t.dur*1000; t.done = false; t.warned = false; t.warned1 = false; t.doneSeen = false; save(); render(); }
function restart(id){ const t = find(id); if(!t) return;
  if(!confirm("Recomeçar "+label(t)+" ("+t.char+") com "+Math.round(t.dur/86400)+" dias?")) return;
  startT(id); }
function del(id){ const t = find(id); if(!t) return;
  if(!confirm("Apagar "+label(t)+" ("+t.char+")?")) return;
  S.timers = S.timers.filter(x=>x!==t); save(); render(); }

// ===== Bosses: as mesmas ações do PC =====
function stopTimer(t){ t.pStart=null; t.warned=false; t.warned1=false; t.end=null; t.start=null; t.over=false; t.done=false; t.recorded=false; (t.subs||[]).forEach(x=>x.f=false); }
function countBoss(t){ if(t.counted) return; t.counted = true; const st = STATS(); st.bosses[bn(t)] = (st.bosses[bn(t)]||0) + 1; }
function setChests(t, n){ const st = STATS(), old = t.chests||0; if(old === n) return; st.chests = Math.max(0, (st.chests||0) - old + n); t.chests = n; countBoss(t); }
$("list").addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const el = b.closest(".it"); if(!el) return;
  bossAct(find(el.dataset.id), b.dataset.act);
});
function bossAct(t, a){
  if(!t) return;
  if(a==="del"){ if(!confirm("Apagar o timer "+bn(t)+"? (também no PC)")) return; S.timers = S.timers.filter(x=>x!==t); }
  if(a==="start"){
    if(t.end && !confirm("Reiniciar "+bn(t)+"? O tempo atual perde-se.")) return;
    if(total(t)<=0 && !isUp(t)) return;
    t.start=Date.now(); t.end=t.start+(isUp(t) ? 100*86400e3 : total(t)*1000); t.over=false; t.done=false; t.warned=false; t.warned1=false; t.recorded=false; t.counted=false; t.chests=0; t.chestH=null; (t.subs||[]).forEach(x=>x.f=false);
  }
  if(a==="reset"){ if(t.end && !confirm("Fazer reset a "+bn(t)+"?")) return; stopTimer(t); }
  if(a==="rec"){
    if(!t.end||t.recorded) return;
    t.recorded=true;
    const sec=elapsed(t), best=S.records[bn(t)], novo=best==null||sec<best;
    t.last=sec; if(novo) S.records[bn(t)]=sec;
    countBoss(t);
    toast(bn(t)+": dungeon feita em "+fmt(sec)+(novo?" 🏆 novo recorde!":""), novo?"good":"");
  }
  if(a==="ptim"){ t.pStart = t.pStart ? null : Date.now(); }
  if(a==="loop"){ if(t.loopStart){ t.loopStart=null; } else { t.loopStart=Date.now(); t.loopN=0; } }
  if(/^chest[1-5]$/.test(a)) setChests(t, +a.slice(5));
  save(); render();
}

// ===== Folha de adicionar / ajustar =====
let F = {};
function openSheet(html){ $("sheet").innerHTML = `<div class="grab"></div>`+html; $("ov").classList.add("on"); $("sheet").classList.add("on"); }
function closeSheet(){ $("ov").classList.remove("on"); $("sheet").classList.remove("on"); }
const sheetOpen = () => $("sheet").classList.contains("on");
function durFields(d,h,m){
  return `<div class="opts" style="margin-bottom:10px">${QUICK.map(q=>`<button class="opt" onclick="quick(${q})">${q} dias</button>`).join("")}</div>
    <div class="dur"><label>Dias<input id="fd" type="number" inputmode="numeric" min="0" value="${d}"></label>
    <label>Horas<input id="fh" type="number" inputmode="numeric" min="0" max="23" value="${h}"></label>
    <label>Minutos<input id="fm" type="number" inputmode="numeric" min="0" max="59" value="${m}"></label></div>`;
}
function quick(d){ $("fd").value = d; $("fh").value = 0; $("fm").value = 0; F.d = d; F.h = 0; F.m = 0; }
const readDur = () => (parseInt($("fd").value)||0)*86400 + (parseInt($("fh").value)||0)*3600 + (parseInt($("fm").value)||0)*60;

function openAdd(){
  if(UI.tab==="boss"){ const k = Object.keys(BOSSES)[0]; F = {boss:k, m:BOSSES[k].m, s:BOSSES[k].s, label:""}; drawBossAdd(); return; }
  F = {char: UI.filter || S.chars[0] || "", pick: UI.tab==="trajes" ? KINDS[0] : RACES[0]}; drawAdd();
}
function drawBossAdd(){
  openSheet(`<h2>Novo timer de boss</h2>
    <div class="lbl">Boss</div>
    <div class="opts">${Object.keys(BOSSES).map(k=>`<button class="opt ${F.boss===k?"on":""}" onclick="F.boss='${k}';F.m=BOSSES['${k}'].m;F.s=BOSSES['${k}'].s;drawBossAdd()">${k}</button>`).join("")}</div>
    ${F.boss==="Personalizado"?`<div class="lbl">Nome</div><input id="bl" type="text" maxlength="30" placeholder="Ex: Rei Aranha" value="${esc(F.label)}" oninput="F.label=this.value">`:""}
    <div class="lbl">Tempo</div>
    <div class="dur two"><label>Minutos<input id="bm" type="number" inputmode="numeric" min="0" max="999" value="${F.m}" oninput="F.m=this.value"></label>
      <label>Segundos<input id="bs" type="number" inputmode="numeric" min="0" max="59" value="${F.s}" oninput="F.s=this.value"></label></div>
    <button class="go" onclick="doBossAdd()">Adicionar</button><div class="err" id="err"></div>`);
}
function doBossAdd(){
  const m = parseInt(F.m)||0, s = parseInt(F.s)||0;
  if(m*60+s<=0 && !(BOSSES[F.boss]||{}).up){ $("err").textContent = "Escolhe o tempo."; return; }
  const t = newBoss(F.boss, m, s);
  if(F.boss==="Personalizado" && (F.label||"").trim()) t.label = F.label.trim().slice(0,30);
  S.timers.push(t); save(); closeSheet(); render();
}
function drawAdd(){
  const tr = UI.tab==="trajes", opts = tr ? KINDS : RACES;
  openSheet(`<h2>${tr?"Novo traje":"Novo pet"}</h2>
    <div class="lbl">Personagem</div>
    <div class="opts">${S.chars.map(c=>`<button class="opt ${F.char===c?"on":""}" onclick="F.char=${esc(JSON.stringify(c))};drawAdd()">${esc(c)}</button>`).join("")}
      <button class="opt add" onclick="$('nc').classList.toggle('on');$('ncn').focus()">+ Nova</button></div>
    <div class="nc ${S.chars.length?"":"on"}" id="nc"><input id="ncn" type="text" placeholder="Nome da personagem" onkeydown="if(event.key==='Enter')addChar()"><button onclick="addChar()">OK</button></div>
    <div class="lbl">${tr?"Tipo":"Raça"}</div>
    <div class="opts">${opts.map(o=>{ const im = tr ? TRAJE_IMG[o] : PET_IMG[o]; return `<button class="opt ${im?"oimg":""} ${F.pick===o?"on":""}" onclick="F.pick='${o}';drawAdd()">${im?`<img src="${im}" alt="">`:""}${o}</button>`; }).join("")}</div>
    ${tr?"":`<div class="lbl">Nome do pet (opcional)</div><input id="fn" type="text" placeholder="${esc(F.pick)}" value="${esc(F.name||"")}" oninput="F.name=this.value">`}
    <div class="lbl">Tempo restante</div>${durFields(F.d||0,F.h||0,F.m||0)}
    <button class="go" onclick="doAdd()">Adicionar</button><div class="err" id="err"></div>`);
  ["fd","fh","fm"].forEach((k,i)=>$(k).addEventListener("input",e=>F["dhm"[i]]=e.target.value));
}
function addChar(){
  const n = $("ncn").value.trim(); if(!n) return;
  if(!S.chars.includes(n)) S.chars.push(n);
  F.char = n; save(); render(); drawAdd();
}
function doAdd(){
  const dur = readDur();
  if(!F.char){ $("err").textContent = "Escolhe ou cria uma personagem."; return; }
  if(dur<=0){ $("err").textContent = "Escolhe o tempo (ex: 30 dias)."; return; }
  const t = {id:newId(), page:UI.tab, char:F.char, dur, end:Date.now()+dur*1000, done:false};
  if(UI.tab==="trajes"){ t.kind = F.pick; t.name = F.char; } else { t.race = F.pick; t.name = (F.name||"").trim() || F.pick; }
  S.timers.push(t); save(); closeSheet(); render();
}
function openAdjust(id){
  const t = find(id); if(!t) return; F = {id};
  const s = rem(t);
  openSheet(`<h2>Ajustar tempo</h2><div class="sub1" style="margin-top:-8px">${esc(label(t))} · 👤 <b>${esc(t.char||"")}</b></div>
    <div class="lbl">Tempo restante</div>${durFields(Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60))}
    <button class="go" onclick="doAdjust()">Guardar e pôr a contar</button><div class="err" id="err"></div>`);
}
function doAdjust(){
  const t = find(F.id), dur = readDur(); if(!t) return closeSheet();
  if(dur<=0){ $("err").textContent = "O tempo tem de ser maior que zero."; return; }
  t.end = Date.now()+dur*1000; t.dur = Math.max(t.dur, dur); t.done = false; t.warned = dur<=WARN; t.warned1 = dur<=WARN1; t.doneSeen = false;
  save(); closeSheet(); render();
}

// ===== Avisos =====
let toastT;
function toast(msg, kind){
  const el = $("toast"); el.textContent = msg; el.className = "toast on"+(kind?" "+kind:"");
  clearTimeout(toastT); toastT = setTimeout(()=>el.className = "toast", 6000);
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
  try{ new Notification("Helparino",{body:msg}); }catch(e){}
}
$("toast").onclick = () => $("toast").className = "toast";
let AC = null;
function beep(){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    [0,.25,.5].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.15;o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.15);}); }catch(e){}
}
// o que já estava acabado/avisado quando a página abre (ou chega do PC) não volta a apitar
function markSeen(){
  S.timers.forEach(t=>{
    if(t.page==="boss"){ const L=(BOSSES[t.name]||{}).loop; if(L && t.loopStart) t.loopN = Math.floor((Date.now()-t.loopStart)/1000/L); return; }
    const st = state(t); if(st==="done") t.doneSeen = true; if(st==="warn"||st==="done") t.warned = true;
    if(t.page==="trajes" && (st==="done" || (t.end && rem(t)<=WARN1))) t.warned1 = true;
  });
}

// ===== Login =====
let lmode = "in";
function setMode(m){
  lmode = m; $("lerr").textContent = "";
  $("lbtn").textContent = m==="in" ? "Entrar" : "Criar conta";
  $("lswap").textContent = m==="in" ? "Ainda não tens conta? Criar conta" : "Já tens conta? Entrar";
  $("lp2").style.display = m==="in" ? "none" : "";
}
async function doAuth(){
  const u = $("lu").value.trim(), p = $("lp").value, up = lmode==="up", er = $("lerr");
  if(!u || !p){ er.textContent = "Preenche o nome e a password."; return; }
  if(!SB.validName(u)){ er.textContent = "O nome só pode ter letras, números e . _ - (3 a 20)."; return; }
  if(up && p.length < 6){ er.textContent = "A password tem de ter pelo menos 6 caracteres."; return; }
  if(up && p !== $("lp2").value){ er.textContent = "As passwords não coincidem."; return; }
  $("lbtn").disabled = true; er.textContent = "A ligar…";
  try{ if(up) await SB.signUp(u, p); else await SB.signIn(u, p); }
  catch(e){ er.textContent = authMsg(e, up); $("lbtn").disabled = false; return; }
  $("lbtn").disabled = false; er.textContent = "";
  enter(SB.ses.name);
}
function enter(name){
  $("login").classList.remove("on"); loadUser(name); $("who").textContent = name; $("av").textContent = (name||"?").slice(0,1).toUpperCase();
  render(); Sync.start();
}
function logout(){
  if(CUR && !confirm("Sair da conta neste telemóvel?")) return;
  Sync.stop(); SB.clear(); CUR = null; S = {timers:[], chars:[], records:{}};
  $("list").innerHTML = ""; $("lp").value = ""; $("lp2").value = ""; setMode("in"); $("login").classList.add("on");
}
Sync.onStatus = (ok, msg) => { const el = $("sy"); el.className = "sy"+(ok?" ok":""); el.textContent = ok ? "● Sincronizado" : "○ Sem ligação"; el.title = msg||""; };
Sync.onAuthLost = () => { alert("A sessão expirou. Entra outra vez."); CUR = null; logout(); };
Sync.onChange = () => {
  markSeen();
  try{ localStorage.setItem(KEY(CUR), JSON.stringify(S)); }catch(e){}
  if(UI.filter && !S.chars.includes(UI.filter)) UI.filter = "";
  if(!sheetOpen()) render();
};

// ===== Relógio =====
let lastSig = "";
const sigOf = () => S.timers.map(t=>[t.id,state(t),!!t.recorded,!!t.loopStart,!!t.pStart,t.chests||0].join(":")).join() + JSON.stringify(Object.values(S.todos||{}).map(L=>(L||[]).filter(x=>isBio(x.t)).map(x=>[!!x.d,!!x.yo,!!x.bs,!!x.ys])));
setInterval(()=>{
  if(!CUR) return;
  let changed = false;
  S.timers.forEach(t=>{
    const nm = tName(t);
    if(t.page==="boss"){
      const cfg = BOSSES[t.name]||{};
      if(cfg.loop && t.loopStart){ const n = Math.floor((Date.now()-t.loopStart)/1000/cfg.loop);
        if(n>(t.loopN||0)){ t.loopN = n; beep(); if(cfg.loop>=60) toast(nm+": "+(cfg.loopName||"Spawn Ovos")+" (#"+n+")"); } }
      if(cfg.ptimer && t.pStart && pRem(t,cfg.ptimer)===0){ t.pStart = null; changed = true; beep(); toast(nm+": "+cfg.ptimer.n+" terminou!"); }
      if(!t.end) return;
      (t.subs||[]).forEach(x=>{ if(!x.f && subRem(t,x)===0){ x.f = true; changed = true; beep(); toast(nm+": "+x.n+" terminou!"); } });
      if(Date.now()>=t.end){
        if(cfg.cooldown){ t.endedAt = t.end; t.cd = true; stopTimer(t); t.chests = 0; t.counted = false; t.chestH = null; t.loopStart = null;
          changed = true; beep(); toast(nm+": já podes fazer de novo!"); return; }
        if(!isUp(t) && !t.over){ t.over = true; changed = true; beep(); toast(nm+": "+fmt(total(t))+" passaram — o timer continua a contar.", "bad"); }
      }
      return;
    }
    if(t.page!=="trajes" && t.page!=="pets") return;
    const st = state(t);
    if(t.page==="trajes" && t.end && !t.warned1 && t.dur>WARN1 && rem(t)<=WARN1 && st!=="done"){ t.warned1 = true; t.warned = true; changed = true; beep(); toast(nm+" falta menos de 1h para acabar"); }
    if(st==="warn" && !t.warned && t.dur>WARN){ t.warned = true; changed = true; beep(); toast(nm+" falta menos de 24h para acabar"); }
    if(st==="done" && !t.doneSeen){ t.doneSeen = true; changed = true; beep(); toast(nm+" terminou!", "bad"); }
    if(st==="done" && t.end){ t.endedAt = t.end; t.end = null; t.done = true; changed = true; }
  });
  if(bioTickM()) changed = true;
  if(changed) save();
  const sig = sigOf();
  if(changed || sig!==lastSig){ lastSig = sig; if(!sheetOpen()) render(); return; }
  const nx = document.querySelector("[data-nx]"); if(nx) nx.innerHTML = heroNext();
  document.querySelectorAll("[data-bt]").forEach(el=>{ const [c,p] = el.dataset.bt.split("|"), x = ((S.todos||{})[c]||[]).find(y=>isBio(y.t)); if(x && x[p+"s"]) el.textContent = fmt(bioLeft(x,p)); });
  document.querySelectorAll("[data-bb]").forEach(el=>{ const [c,p] = el.dataset.bb.split("|"), x = ((S.todos||{})[c]||[]).find(y=>isBio(y.t)); if(x && x[p+"s"]) el.style.width = Math.max(0,Math.min(100,bioLeft(x,p)/(BH(p)*3600)*100))+"%"; });
  document.querySelectorAll(".it[data-id],.bh[data-id],.pc2[data-id],.pcx[data-id]").forEach(el=>{
    const t = find(el.dataset.id); if(!t) return;
    const tm = el.querySelector("[data-t]"); if(tm) tm.innerHTML = t.page==="boss" ? bossTime(t) : itemTime(t);
    const f = el.querySelector("[data-f]"); if(f) f.style.strokeDashoffset = ringOff(t) * (+f.dataset.c||RC) / RC;
    const en = el.querySelector("[data-end]"); if(en) en.innerHTML = bossEnd(t);
    const e = el.querySelector("[data-e]"); if(e) e.textContent = endText(t);
    const pb = el.querySelector("[data-pb]"); if(pb) pb.style.width = pctOf(t)+"%";
    if(t.page!=="boss") return;
    const cfg = BOSSES[t.name]||{};
    el.querySelectorAll("[data-s]").forEach(b=>{ const x = (t.subs||[])[+b.dataset.s]; if(x) b.textContent = fmt(subRem(t,x)); });
    const x1 = el.querySelector("[data-el]"); if(x1) x1.textContent = fmt(elapsed(t));
    const x2 = el.querySelector("[data-lp]"); if(x2 && cfg.loop) x2.textContent = fmt(loopRem(t,cfg.loop));
    const x3 = el.querySelector("[data-pt]"); if(x3 && cfg.ptimer) x3.textContent = fmt(pRem(t,cfg.ptimer));
  });
}, 500);

try{ if(window.Notification && Notification.permission==="default") document.addEventListener("click",()=>Notification.requestPermission(),{once:true}); }catch(e){}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && CUR) Sync.cycle(); });
(()=>{ const s = SB.load(); if(s && s.uid) enter(s.name); else { setMode("in"); $("login").classList.add("on"); } })();
</script>
