<style>
:root{
  --bg:#0b0d14; --card:#141724; --card2:#1a1e2e; --line:rgba(255,255,255,.08);
  --text:#eceef6; --muted:#8a90a6; --a1:#8b5cf6; --a2:#22d3ee; --ok:#34d399; --bad:#fb7185; --gold:#fbbf24;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{min-height:100vh;color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  background:radial-gradient(600px 380px at 100% -5%,rgba(139,92,246,.22),transparent),radial-gradient(500px 400px at -10% 105%,rgba(34,211,238,.12),transparent),var(--bg);
  background-attachment:fixed;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px)}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;width:100%}
input:focus{border-color:var(--a1)}

header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header img{width:38px;height:38px;border-radius:10px}
header h1{font-size:21px;letter-spacing:.2px}
header h1 span{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}

.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;padding:11px 6px;border-radius:10px;font-weight:700;font-size:15px;color:var(--muted);position:relative}
.tabs button.on{color:#fff;background:linear-gradient(90deg,rgba(139,92,246,.55),rgba(99,102,241,.45))}
.tabs .n{font-weight:600;font-size:12px;opacity:.8;margin-left:4px}
.tabs .dot{position:absolute;top:8px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.tabs .dot.bad{background:var(--bad)}

.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{color:#fff;border-color:rgba(139,92,246,.7);background:rgba(139,92,246,.25)}
.chip .del{margin-left:6px;color:var(--bad)}

.it{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;margin-bottom:10px}
.it.warn{border-color:rgba(251,191,36,.55);background:linear-gradient(180deg,rgba(251,191,36,.08),var(--card) 60%)}
.it.done{border-color:rgba(251,113,133,.6);background:linear-gradient(180deg,rgba(251,113,133,.1),var(--card) 60%)}
.row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.who{min-width:0}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;margin-right:6px}
.b-Capacete{background:rgba(34,211,238,.15);color:#67e8f9}
.b-Armadura{background:rgba(139,92,246,.2);color:#c4b5fd}
.b-Arma{background:rgba(251,113,133,.16);color:#fda4af}
.b-pet{background:rgba(251,191,36,.14);color:#fcd34d}
.nm{font-weight:700;font-size:15px}
.ch{color:var(--muted);font-size:13px;margin-top:6px}
.ch b{color:var(--text);font-weight:600}
.rem{text-align:right;flex:none}
.rem .d{font-size:24px;font-weight:800;line-height:1}
.rem .h{font:600 13px ui-monospace,Consolas,monospace;color:var(--muted);margin-top:3px}
.it.warn .rem .d{color:var(--gold)}
.it.done .rem .d{color:var(--bad);font-size:17px}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);margin:12px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2))}
.it.warn .bar i{background:var(--gold)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.end{font-size:12px;color:var(--muted)}
.it.warn .end{color:var(--gold);font-weight:600}
.it.done .end{color:var(--bad);font-weight:600}
.acts{display:flex;gap:6px}
.acts button{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600}
.acts button.dl{color:var(--bad)}

.empty{text-align:center;color:var(--muted);padding:56px 20px;border:1px dashed var(--line);border-radius:18px;line-height:1.6}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 22px);width:62px;height:62px;border-radius:20px;border:0;
  background:linear-gradient(135deg,var(--a1),#6366f1);color:#fff;font-size:32px;font-weight:300;box-shadow:0 12px 30px -8px rgba(139,92,246,.8);z-index:5}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s;z-index:10}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:#121522;border-top:1px solid var(--line);
  border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .28s ease;z-index:11}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:0 auto 12px}
.sheet h2{font-size:19px;margin-bottom:14px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.opt.on{color:#fff;border-color:rgba(139,92,246,.75);background:rgba(139,92,246,.28)}
.opt.add{border-style:dashed}
.nc{display:none;gap:8px;margin-top:8px}
.nc.on{display:flex}
.nc button{flex:none;border:0;border-radius:12px;padding:0 16px;font-weight:700;background:var(--a1);color:#fff}
.dur{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dur label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px;text-align:center}
.dur input{text-align:center;font-size:20px;font-weight:700;padding:10px 4px}
.go{width:100%;border:0;border-radius:14px;padding:15px;margin-top:20px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--a1),#6366f1)}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:16px;text-align:center}

.toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 10px);background:#1d2133;border:1px solid rgba(251,191,36,.5);
  border-radius:14px;padding:13px 15px;font-weight:600;font-size:14px;z-index:20;transform:translateY(-140%);transition:.3s;box-shadow:0 14px 30px -10px #000}
.toast.on{transform:none}
.toast.bad{border-color:rgba(251,113,133,.6)}

header{justify-content:space-between}
.hl{display:flex;align-items:center;gap:10px}
.me{text-align:right;font-size:12px;color:var(--muted);line-height:1.35}
.me b{color:var(--text);font-size:13px}
.me button{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.sy{font-size:11px}
.sy.ok{color:var(--ok)}
.it.stop .rem .d{color:var(--muted);font-size:17px}
.it.stop .bar i{background:rgba(255,255,255,.18)}
.acts button.pl{background:linear-gradient(90deg,var(--a1),#6366f1);border-color:transparent;color:#fff}
#login{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
#login.on{display:flex}
.lbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center}

<body>
<div id="login"><div class="lbox">
  <img class="appicon" alt="">
  <h1>M2 <span>Timers</span></h1>
  <p id="lsub">Entra com a mesma conta do Metin2 Helper</p>
  <input id="lu" type="text" placeholder="Nome de utilizador" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
  <input id="lp" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth()">
  <input id="lp2" type="password" placeholder="Repetir password" style="display:none" onkeydown="if(event.key==='Enter')doAuth()">

</div></div>

<header><div class="hl"><img class="appicon" alt=""><h1>M2 <span>Timers</span></h1></div>
  <div class="me"><b id="who"></b><br><span class="sy" id="sy"></span><br><button onclick="logout()">Sair da conta</button></div></header>

<div class="tabs" id="tabs"></div>
<div class="chips" id="filters"></div>
<div id="list"></div>

<button class="fab" onclick="openAdd()" aria-label="Adicionar">+</button>

<div class="ov" id="ov" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
document.querySelectorAll("img.appicon").forEach(i=>i.src=document.querySelector("link[rel=apple-touch-icon]").href);

// ===== Listas — edita aqui =====
const RACES = ["Macaco","Razador","Nemere","Dragonette","Meley","Bashido","Executor","Nessie","Alastor"];
const KINDS = ["Capacete","Armadura","Arma"];
const QUICK = [7,15,30,60];
const WARN = 24*3600*1000;

// ===== Sincronização online (Supabase) — igual no .exe e no telemóvel =====
const SB_URL = "https://dmmnsddjrqjwbzowtscy.supabase.co";
const SB_KEY = "sb_publishable_qrJmQB2GUytSMfDbL5cH7w_rlWaRHjl";
const SB = {
  ses: null,
  load(){ try{ this.ses = JSON.parse(localStorage.getItem("m2_sb")); }catch(e){ this.ses = null; } return this.ses; },
  store(){ try{ localStorage.setItem("m2_sb", JSON.stringify(this.ses)); }catch(e){} },
  clear(){ this.ses = null; try{ localStorage.removeItem("m2_sb"); }catch(e){} },
  email: u => u.toLowerCase() + "@users.m2helper.app",
  validName: u => /^[a-zA-Z0-9._-]{3,20}$/.test(u),
  async auth(path, body){
    let r;
    try{ r = await fetch(SB_URL+"/auth/v1/"+path, {method:"POST", headers:{apikey:SB_KEY, "Content-Type":"application/json"}, body:JSON.stringify(body)}); }
    catch(e){ throw new Error("OFFLINE"); }
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ const m = j.msg || j.error_description || j.message || j.error || ("Erro "+r.status); const err = new Error(m); err.status = r.status; throw err; }
    return j;
  },
  setSes(j, name){
    this.ses = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Date.now()+(j.expires_in||3600)*1000, uid:j.user.id, name};
    this.store();
  },
  async signUp(u, p){
    const j = await this.auth("signup", {email:this.email(u), password:p, data:{username:u}});
    if(!j.access_token) throw new Error("CONFIRM");
    this.setSes(j, u);
  },
  async signIn(u, p){
    const j = await this.auth("token?grant_type=password", {email:this.email(u), password:p});
    this.setSes(j, (j.user && j.user.user_metadata && j.user.user_metadata.username) || u);
  },
  async token(){
    if(this.ses.expires_at - Date.now() < 60000){
      try{ const j = await this.auth("token?grant_type=refresh_token", {refresh_token:this.ses.refresh_token}); this.setSes(j, this.ses.name); }
      catch(e){ if(e.status===400 || e.status===401) throw new Error("AUTH"); throw e; }
    }
    return this.ses.access_token;
  },
  async rest(path, opt={}){
    const t = await this.token();
    let r;
    try{ r = await fetch(SB_URL+"/rest/v1/"+path, {...opt, headers:{apikey:SB_KEY, Authorization:"Bearer "+t, "Content-Type":"application/json", ...(opt.headers||{})}}); }
    catch(e){ throw new Error("OFFLINE"); }
    if(r.status===401) throw new Error("AUTH");
    if(!r.ok) throw new Error("REST "+r.status+" "+(await r.text()));
    const tx = await r.text(); return tx ? JSON.parse(tx) : null;
  }
};
// Cada timer é uma linha; "meta" guarda personagens e recordes. O último a mudar ganha.
const Sync = {
  LOCAL: ["warned","doneSeen","loopN"],   // avisos ficam em cada aparelho
  st: null, iv: null, tm: null, busy: false,
  onChange: null, onStatus: null, onAuthLost: null,
  key(){ return "m2_sync_" + SB.ses.uid; },
  loadSt(){ try{ this.st = JSON.parse(localStorage.getItem(this.key())); }catch(e){} this.st = this.st || {synced:{}, last:""}; },
  saveSt(){ try{ localStorage.setItem(this.key(), JSON.stringify(this.st)); }catch(e){} },
  clean(o){ const c = {}; for(const k in o) if(!this.LOCAL.includes(k)) c[k] = o[k]; return c; },
  rows(){
    const m = {};
    S.timers.forEach(t=>{ m["t:"+t.id] = JSON.stringify(this.clean(t)); });
    m.meta = JSON.stringify({chars:S.chars||[], records:S.records||{}});
    return m;
  },
  apply(id, data, first){
    if(id === "meta"){
      if(!data) return;
      if(first){ // primeira vez neste aparelho: junta personagens e recordes
        const ch = [...(data.chars||[])]; (S.chars||[]).forEach(c=>{ if(!ch.includes(c)) ch.push(c); });
        const rec = {...(data.records||{})}; for(const k in (S.records||{})) if(rec[k]==null || S.records[k]<rec[k]) rec[k] = S.records[k];
        S.chars = ch; S.records = rec;
      } else { S.chars = data.chars||[]; S.records = data.records||{}; }
      return;
    }
    const tid = id.slice(2), i = S.timers.findIndex(t=>String(t.id)===tid);
    if(!data){ if(i>=0) S.timers.splice(i,1); return; }
    const keep = {}; if(i>=0) this.LOCAL.forEach(k=>{ if(k in S.timers[i]) keep[k] = S.timers[i][k]; });
    const nt = Object.assign(data, keep);
    if(i>=0) S.timers[i] = nt; else S.timers.push(nt);
  },
  async pull(){
    let since = "";
    if(this.st.last){ since = new Date(new Date(this.st.last).getTime()-10000).toISOString(); }
    const rows = await SB.rest("m2_items?select=id,data,deleted,srv_at&order=srv_at.asc"+(since?"&srv_at=gt."+encodeURIComponent(since):""));
    let changed = false; const cur = this.rows();
    for(const r of rows){
      if(!this.st.last || r.srv_at > this.st.last) this.st.last = r.srv_at;
      const rs = r.deleted ? null : JSON.stringify(r.data), syn = this.st.synced[r.id];
      if(syn === rs) continue;
      const first = syn === undefined;
      const dirty = !first && (cur[r.id] === undefined ? syn !== null : cur[r.id] !== syn);
      if(dirty) continue;                 // mudaste isto aqui: vai ser enviado
      this.apply(r.id, r.deleted ? null : r.data, first);
      this.st.synced[r.id] = (first && r.id==="meta") ? "" : rs;  // meta junta-se e volta a ser enviada
      changed = true;
    }
    this.saveSt(); return changed;
  },
  async push(){
    const cur = this.rows(), out = [], now = Date.now();
    for(const id in cur) if(this.st.synced[id] !== cur[id]) out.push({user_id:SB.ses.uid, id, data:JSON.parse(cur[id]), deleted:false, u:now});
    for(const id in this.st.synced) if(!(id in cur) && this.st.synced[id] !== null) out.push({user_id:SB.ses.uid, id, data:null, deleted:true, u:now});
    if(!out.length) return;
    await SB.rest("m2_items?on_conflict=user_id,id", {method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"}, body:JSON.stringify(out)});
    out.forEach(r=>{ this.st.synced[r.id] = r.deleted ? null : cur[r.id]; });
    this.saveSt();
  },
  async cycle(){
    if(this.busy || !SB.ses) return; this.busy = true;
    try{
      const ch = await this.pull();
      if(ch && this.onChange) this.onChange();
      await this.push();
      this.onStatus && this.onStatus(true);
    }catch(e){
      if(e.message === "AUTH"){ this.stop(); this.onAuthLost && this.onAuthLost(); }
      else this.onStatus && this.onStatus(false, e.message);
    }
    this.busy = false;
  },
  touch(){ if(!SB.ses) return; clearTimeout(this.tm); this.tm = setTimeout(()=>this.cycle(), 1200); },
  start(){ this.stop(); this.loadSt(); this.cycle(); this.iv = setInterval(()=>{ if(!document.hidden) this.cycle(); }, 5000); },
  stop(){ clearInterval(this.iv); clearTimeout(this.tm); this.iv = null; }
};
function authMsg(e, up){
  const m = String(e.message||e);
  if(m === "OFFLINE") return "Sem ligação à internet.";
  if(m === "CONFIRM") return "Conta criada, mas o Supabase pede confirmação de email. Desativa \"Confirm email\" no Supabase.";
  if(/invalid login/i.test(m)) return "Nome ou password errados.";
  if(/already registered|already exists/i.test(m)) return "Esse nome já existe.";
  if(/password/i.test(m) && /least|short|6/i.test(m)) return "A password tem de ter pelo menos 6 caracteres.";
  if(/rate|too many/i.test(m)) return "Muitas tentativas. Espera um bocado.";
  return (up ? "Não foi possível criar a conta: " : "Não foi possível entrar: ") + m;
}


// ===== Dados (mesmo formato do .exe: S.timers com page "trajes"/"pets") =====
let CUR = null, S = {timers:[], chars:[], records:{}}, UI = {tab:"trajes", filter:"", editChars:false};
try{ Object.assign(UI, JSON.parse(localStorage.getItem("m2m_ui"))||{}); }catch(e){} UI.editChars = false;
const KEY = u => "m2m_u_" + u.toLowerCase();
const save = () => { if(!CUR) return; try{ localStorage.setItem(KEY(CUR), JSON.stringify(S)); localStorage.setItem("m2m_ui", JSON.stringify({tab:UI.tab, filter:UI.filter})); }catch(e){} Sync.touch(); };
function loadUser(u){
  CUR = u; let d = null;
  try{ d = JSON.parse(localStorage.getItem(KEY(u))); }catch(e){}
  S = d || {timers:[], chars:[], records:{}};
  S.timers = S.timers||[]; S.chars = S.chars||[]; S.records = S.records||{};
  if(UI.filter && !S.chars.includes(UI.filter)) UI.filter = "";
  markSeen();
}
const newId = () => Date.now()+Math.random();

const $ = id => document.getElementById(id);
const esc = x => String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const p2 = n => String(n).padStart(2,"0");
const mine = () => S.timers.filter(t=>t.page==="trajes"||t.page==="pets");
const left = t => t.end ? Math.max(0, t.end-Date.now()) : (t.done ? 0 : t.dur*1000);
const state = t => t.done || (t.end && t.end<=Date.now()) ? "done" : !t.end ? "stop" : left(t)<=WARN ? "warn" : "";
function remHTML(t){
  const st = state(t);
  if(st==="done") return `<div class="d">Terminou</div>`;
  const s = Math.ceil(left(t)/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), x = s%60;
  if(st==="stop") return `<div class="d">Parado</div><div class="h">${d}d ${p2(h)}:${p2(m)}</div>`;
  return d>0 ? `<div class="d">${d}d</div><div class="h">${p2(h)}:${p2(m)}:${p2(x)}</div>`
             : `<div class="d">${p2(h)}:${p2(m)}</div><div class="h">${p2(x)}s</div>`;
}
function endText(t){
  const st = state(t);
  if(st==="done") return "Terminou";
  if(st==="stop") return "Ainda não iniciado";
  const dt = new Date(t.end), when = dt.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"})+" às "+dt.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
  return st==="warn" ? "⚠ Menos de 24h · "+when : "Acaba a "+when;
}
const pct = t => { const st = state(t); return st==="done" ? 0 : st==="stop" ? 100 : Math.max(0, Math.min(100, left(t)/(t.dur*1000)*100)); };
const label = t => t.page==="trajes" ? t.kind : (t.race||t.name);
const order = t => { const st = state(t); return st==="done" ? -1 : st==="stop" ? 9e15 : t.end; };

// ===== Desenhar =====
function render(){
  if(!CUR) return;
  const cnt = p => mine().filter(t=>t.page===p);
  const flag = p => { const st = cnt(p).map(state); return st.includes("done") ? "bad" : st.includes("warn") ? "w" : ""; };
  $("tabs").innerHTML = [["trajes","Trajes"],["pets","Pets"]].map(([k,n])=>{ const f = flag(k);
    return `<button class="${UI.tab===k?"on":""}" onclick="setTab('${k}')">${n}<span class="n">${cnt(k).length}</span>${f?`<span class="dot ${f==="bad"?"bad":""}"></span>`:""}</button>`; }).join("");

  if(S.chars.length){
    $("filters").style.display = "";
    $("filters").innerHTML = `<button class="chip ${!UI.filter?"on":""}" onclick="setFilter('')">Todos</button>` +
      S.chars.map((c,i)=>`<button class="chip ${UI.filter===c?"on":""}" onclick="${UI.editChars?`delChar(${i})`:`setFilter(${i})`}">${esc(c)}${UI.editChars?`<span class="del">✕</span>`:""}</button>`).join("") +
      `<button class="chip" onclick="UI.editChars=!UI.editChars;render()">${UI.editChars?"✔ Feito":"✎"}</button>`;
  } else $("filters").style.display = "none";

  const L = mine().filter(t=>t.page===UI.tab && (!UI.filter || t.char===UI.filter)).sort((a,b)=>order(a)-order(b));
  if(!L.length){
    $("list").innerHTML = `<div class="empty"><b>Sem ${UI.tab==="trajes"?"trajes":"pets"} ${UI.filter?"para "+esc(UI.filter):""}</b>Carrega no <b style="display:inline;font-size:inherit">+</b> para adicionar.</div>`;
    return;
  }
  $("list").innerHTML = L.map(t=>{ const st = state(t), nm = t.page==="pets" && t.name && t.name!==t.race ? t.name : "";
    return `<div class="it ${st}" data-id="${t.id}">
      <div class="row1"><div class="who">
        <span class="badge ${t.page==="trajes"?"b-"+t.kind:"b-pet"}">${esc(t.page==="trajes"?t.kind:(t.race||"Pet"))}</span>${nm?`<span class="nm">${esc(nm)}</span>`:""}
        <div class="ch">👤 <b>${esc(t.char)}</b></div></div>
        <div class="rem" data-r>${remHTML(t)}</div></div>
      <div class="bar"><i data-b style="width:${pct(t)}%"></i></div>
      <div class="row2"><span class="end">${endText(t)}</span>
        <div class="acts"><button onclick="openAdjust('${t.id}')">✎</button>${st==="stop"
          ?`<button class="pl" onclick="startT('${t.id}')">▶</button>`:`<button onclick="restart('${t.id}')">↻</button>`}<button class="dl" onclick="del('${t.id}')">🗑</button></div></div>
    </div>`; }).join("");
}
function setTab(t){ UI.tab = t; save(); render(); }
function setFilter(i){ UI.filter = i==="" ? "" : S.chars[i]; save(); render(); }
function delChar(i){
  const c = S.chars[i], n = S.timers.filter(x=>x.char===c).length;
  if(!confirm("Apagar a personagem "+c+(n?" e os seus "+n+" timers":"")+"? (também no PC)")) return;
  S.chars.splice(i,1); S.timers = S.timers.filter(x=>x.char!==c);
  if(UI.filter===c) UI.filter = ""; if(!S.chars.length) UI.editChars = false; save(); render();
}
const find = id => S.timers.find(x=>String(x.id)===String(id));
function startT(id){ const t = find(id); if(!t) return; t.end = Date.now()+t.dur*1000; t.done = false; t.warned = false; save(); render(); }
function restart(id){ const t = find(id); if(!t) return;
  if(!confirm("Recomeçar "+label(t)+" ("+t.char+") com "+Math.round(t.dur/86400)+" dias?")) return;
  startT(id); }
function del(id){ const t = find(id); if(!t) return;
  if(!confirm("Apagar "+label(t)+" ("+t.char+")?")) return;
  S.timers = S.timers.filter(x=>x!==t); save(); render(); }

// ===== Folha de adicionar / ajustar =====
let F = {};
function openSheet(html){ $("sheet").innerHTML = `<div class="grab"></div>`+html; $("ov").classList.add("on"); $("sheet").classList.add("on"); }
function closeSheet(){ $("ov").classList.remove("on"); $("sheet").classList.remove("on"); }
const sheetOpen = () => $("sheet").classList.contains("on");
function durFields(d,h,m){
  return `<div class="opts" style="margin-bottom:10px">${QUICK.map(q=>`<button class="opt" onclick="quick(${q})">${q} dias</button>`).join("")}</div>
    <div class="dur"><label>Dias<input id="fd" type="number" inputmode="numeric" min="0" value="${d}"></label>
    <label>Horas<input id="fh" type="number" inputmode="numeric" min="0" max="23" value="${h}"></label>
    <label>Minutos<input id="fm" type="number" inputmode="numeric" min="0" max="59" value="${m}"></label></div>`;
}
function quick(d){ $("fd").value = d; $("fh").value = 0; $("fm").value = 0; F.d = d; F.h = 0; F.m = 0; }
const readDur = () => (parseInt($("fd").value)||0)*86400 + (parseInt($("fh").value)||0)*3600 + (parseInt($("fm").value)||0)*60;

function openAdd(){ F = {char: UI.filter || S.chars[0] || "", pick: UI.tab==="trajes" ? KINDS[0] : RACES[0]}; drawAdd(); }
function drawAdd(){
  const tr = UI.tab==="trajes", opts = tr ? KINDS : RACES;
  openSheet(`<h2>${tr?"Novo traje":"Novo pet"}</h2>
    <div class="lbl">Personagem</div>
    <div class="opts">${S.chars.map(c=>`<button class="opt ${F.char===c?"on":""}" onclick="F.char=${esc(JSON.stringify(c))};drawAdd()">${esc(c)}</button>`).join("")}
      <button class="opt add" onclick="$('nc').classList.toggle('on');$('ncn').focus()">+ Nova</button></div>
    <div class="nc ${S.chars.length?"":"on"}" id="nc"><input id="ncn" type="text" placeholder="Nome da personagem" onkeydown="if(event.key==='Enter')addChar()"><button onclick="addChar()">OK</button></div>
    <div class="lbl">${tr?"Tipo":"Raça"}</div>
    <div class="opts">${opts.map(o=>`<button class="opt ${F.pick===o?"on":""}" onclick="F.pick='${o}';drawAdd()">${o}</button>`).join("")}</div>
    ${tr?"":`<div class="lbl">Nome do pet (opcional)</div><input id="fn" type="text" placeholder="${esc(F.pick)}" value="${esc(F.name||"")}" oninput="F.name=this.value">`}
    <div class="lbl">Tempo restante</div>${durFields(F.d||0,F.h||0,F.m||0)}
    <button class="go" onclick="doAdd()">Adicionar</button><div class="err" id="err"></div>`);
  ["fd","fh","fm"].forEach((k,i)=>$(k).addEventListener("input",e=>F["dhm"[i]]=e.target.value));
}
function addChar(){
  const n = $("ncn").value.trim(); if(!n) return;
  if(!S.chars.includes(n)) S.chars.push(n);
  F.char = n; save(); render(); drawAdd();
}
function doAdd(){
  const dur = readDur();
  if(!F.char){ $("err").textContent = "Escolhe ou cria uma personagem."; return; }
  if(dur<=0){ $("err").textContent = "Escolhe o tempo (ex: 30 dias)."; return; }
  const t = {id:newId(), page:UI.tab, char:F.char, dur, end:Date.now()+dur*1000, done:false};
  if(UI.tab==="trajes"){ t.kind = F.pick; t.name = F.char; } else { t.race = F.pick; t.name = (F.name||"").trim() || F.pick; }
  S.timers.push(t); save(); closeSheet(); render();
}
function openAdjust(id){
  const t = find(id); if(!t) return; F = {id};
  const s = Math.ceil(left(t)/1000);
  openSheet(`<h2>Ajustar tempo</h2><div class="ch" style="margin-top:-8px">${esc(label(t))} · 👤 <b>${esc(t.char)}</b></div>
    <div class="lbl">Tempo restante</div>${durFields(Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60))}
    <button class="go" onclick="doAdjust()">Guardar e pôr a contar</button><div class="err" id="err"></div>`);
}
function doAdjust(){
  const t = find(F.id), dur = readDur(); if(!t) return closeSheet();
  if(dur<=0){ $("err").textContent = "O tempo tem de ser maior que zero."; return; }
  t.end = Date.now()+dur*1000; t.dur = Math.max(t.dur, dur); t.done = false; t.warned = dur*1000<=WARN; t.doneSeen = false;
  save(); closeSheet(); render();
}

// ===== Avisos =====
let toastT;
function toast(msg, bad){
  const el = $("toast"); el.textContent = msg; el.className = "toast on"+(bad?" bad":"");
  clearTimeout(toastT); toastT = setTimeout(()=>el.className = "toast", 6000);
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
  try{ new Notification("M2 Timers",{body:msg}); }catch(e){}
}
$("toast").onclick = () => $("toast").className = "toast";
// o que já estava acabado/avisado quando a página abre (ou chega do PC) não volta a apitar
function markSeen(){ mine().forEach(t=>{ const st = state(t); if(st==="done") t.doneSeen = true; if(st==="warn"||st==="done") t.warned = true; }); }

// ===== Login =====
let lmode = "in";
function setMode(m){
  lmode = m; $("lerr").textContent = "";
  $("lbtn").textContent = m==="in" ? "Entrar" : "Criar conta";
  $("lswap").textContent = m==="in" ? "Ainda não tens conta? Criar conta" : "Já tens conta? Entrar";
  $("lp2").style.display = m==="in" ? "none" : "";
}
async function doAuth(){
  const u = $("lu").value.trim(), p = $("lp").value, up = lmode==="up", er = $("lerr");
  if(!u || !p){ er.textContent = "Preenche o nome e a password."; return; }
  if(!SB.validName(u)){ er.textContent = "O nome só pode ter letras, números e . _ - (3 a 20)."; return; }
  if(up && p.length < 6){ er.textContent = "A password tem de ter pelo menos 6 caracteres."; return; }
  if(up && p !== $("lp2").value){ er.textContent = "As passwords não coincidem."; return; }
  $("lbtn").disabled = true; er.textContent = "A ligar…";
  try{ if(up) await SB.signUp(u, p); else await SB.signIn(u, p); }
  catch(e){ er.textContent = authMsg(e, up); $("lbtn").disabled = false; return; }
  $("lbtn").disabled = false; er.textContent = "";
  enter(SB.ses.name);
}
function enter(name){
  $("login").classList.remove("on"); loadUser(name); $("who").textContent = name;
  render(); Sync.start();
}
function logout(){
  if(CUR && !confirm("Sair da conta neste telemóvel?")) return;
  Sync.stop(); SB.clear(); CUR = null; S = {timers:[], chars:[], records:{}};
  $("list").innerHTML = ""; $("lp").value = ""; $("lp2").value = ""; setMode("in"); $("login").classList.add("on");
}
Sync.onStatus = (ok, msg) => { const el = $("sy"); el.className = "sy"+(ok?" ok":""); el.textContent = ok ? "● Sincronizado" : "○ Sem ligação"; el.title = msg||""; };
Sync.onAuthLost = () => { alert("A sessão expirou. Entra outra vez."); CUR = null; logout(); };
Sync.onChange = () => {
  markSeen();
  try{ localStorage.setItem(KEY(CUR), JSON.stringify(S)); }catch(e){}
  if(UI.filter && !S.chars.includes(UI.filter)) UI.filter = "";
  if(!sheetOpen()) render();
};

// ===== Relógio =====
let lastSig = "";
setInterval(()=>{
  if(!CUR) return;
  let changed = false;
  mine().forEach(t=>{
    const st = state(t), nm = label(t)+" ("+t.char+")";
    if(st==="warn" && !t.warned && t.dur*1000>WARN){ t.warned = true; changed = true; toast(nm+" falta 24h para acabar"); }
    if(st==="done" && !t.doneSeen){ t.doneSeen = true; changed = true; toast(nm+" terminou!", true); }
    if(st==="done" && t.end){ t.end = null; t.done = true; changed = true; } // igual ao .exe
  });
  if(changed) save();
  const sig = mine().map(state).join();
  if(changed || sig!==lastSig){ lastSig = sig; if(!sheetOpen()) render(); return; }
  document.querySelectorAll(".it[data-id]").forEach(el=>{
    const t = find(el.dataset.id); if(!t) return;
    el.querySelector("[data-r]").innerHTML = remHTML(t);
    el.querySelector("[data-b]").style.width = pct(t)+"%";
  });
},1000);

try{ if(window.Notification && Notification.permission==="default") document.addEventListener("click",()=>Notification.requestPermission(),{once:true}); }catch(e){}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && CUR) Sync.cycle(); });
(()=>{ const s = SB.load(); if(s && s.uid) enter(s.name); else { setMode("in"); $("login").classList.add("on"); } })();
</script>
